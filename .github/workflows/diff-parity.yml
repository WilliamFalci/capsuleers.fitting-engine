name: diff-parity

# Differential parity vs a PINNED pyfa-org/Pyfa oracle. Complements ci.yml
# (deterministic fixture suite, per-push) and pyfa-drift.yml (detects changed
# effect IDs): this one detects VALUE regressions across three corpora, every
# stat compared to pyfa —
#   generated : 4 synthetic fits for every published ship (complete hull cover);
#   implants  : every implant SET and ship-affecting booster, drawbacks off and
#               on, on a reference hull plus a rotating slice of the roster;
#   workbench : 2-3 REAL fits per hull published by capsuleers on EVE Workbench
#               (needs EVEWORKBENCH_API_KEY; skipped with a printed note when
#               the corpus is absent, never silently).
#
# Why scheduled + non-blocking (NOT a per-push gate):
#   - it needs a pyfa clone + a Python venv + an eve.db build (heavy/slow);
#   - it compares against pyfa's OWN bundled SDE, which can drift from our
#     committed data/ — so a red run may mean "pyfa/SDE moved", not "we broke".
# It therefore opens an issue with the unexpected diffs instead of failing a
# branch. pyfa is PINNED (PYFA_REF) so a moving master can't flip results; the
# accepted-differences registry (test/diff/known-diffs.mjs) is calibrated
# against this exact pin — bump both together when intentionally updating pyfa.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC (after pyfa-drift at 06:00)
  workflow_dispatch:
    inputs:
      pyfa_ref:
        description: 'Override pinned pyfa ref (commit/tag/branch)'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: diff-parity
  cancel-in-progress: false

env:
  # Pin pyfa to the commit the known-diffs registry was calibrated against.
  PYFA_REF: 8b04f3b271e614b3e103853b44a7851a63d79d0e

jobs:
  diff:
    runs-on: ubuntu-latest
    # Hoisted to the JOB so a step's `if:` can read it — a step's own `env:` is
    # NOT visible to its own condition, so `if: env.X != ''` next to `env: X:
    # ${{ secrets.X }}` silently never runs. That would have skipped the real-fit
    # corpus on every scheduled run while the diff still reported success.
    env:
      EVEWORKBENCH_API_KEY: ${{ secrets.EVEWORKBENCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - run: npm ci
      - run: npm run build

      - name: Build pyfa oracle (pinned)
        env:
          PYFA_REF: ${{ github.event.inputs.pyfa_ref || env.PYFA_REF }}
        run: npm run diff:setup

      # The stacking registry resolves pyfa's attribute NAMES to ids against the
      # RAW SDE, not the shipped bundle: the bundle carries only published
      # attributes and several penalised ones (warpSpeedMultiplier, 600) are
      # not published. `.sde-src/` is gitignored, so stage it — `--force`
      # because the plain fetch short-circuits when data/.build already matches.
      - name: Stage the raw SDE (for the stacking registry)
        run: node scripts/fetch-sde.mjs --force

      # The registry of which (effect, attribute) pairs pyfa stack-penalises is
      # GENERATED from the pinned pyfa. If it is stale the engine silently
      # penalises the wrong set, so check it before trusting a green diff.
      - name: Stacking registry is in sync with the pinned pyfa
        run: npm run stacking:build -- --check

      - name: Harvest the EVE Workbench corpus
        if: env.EVEWORKBENCH_API_KEY != ''
        run: npm run corpus:fetch

      - name: Differential parity (all corpora)
        id: diff
        env:
          PYFA_REF: ${{ github.event.inputs.pyfa_ref || env.PYFA_REF }}
        run: |
          set +e
          npm run diff -- --source=all 2>/dev/null | tee diff-report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Open issue on UNEXPECTED diffs
        if: steps.diff.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let report = ''
            try { report = fs.readFileSync('diff-report.txt', 'utf8') } catch {}
            // Keep the issue body small: from the first reported section onward.
            // DRIFT is printed before UNEXPECTED, so take whichever comes first.
            const marks = ['=== ORACLE SDE DRIFT', '=== UNEXPECTED']
              .map(m => report.indexOf(m)).filter(i => i >= 0)
            const start = marks.length ? Math.min(...marks) : -1
            const body = start >= 0 ? report.slice(start) : report
            // Two distinct failure modes, two distinct titles — a stale pin is a
            // one-line fix, an engine diff is an investigation. Don't conflate.
            const drifted = report.includes('=== ORACLE SDE DRIFT')
            const diffed = report.includes('=== UNEXPECTED')
            const pin = process.env.PYFA_REF.slice(0, 7)
            const title = drifted && !diffed
              ? `diff-parity: pinned pyfa staticdata is stale (${pin})`
              : `diff-parity: unexpected differences vs pyfa (${pin})`
            const lede = drifted
              ? 'The pinned pyfa oracle is missing type(s) our SDE bundle carries, so ' +
                'the affected fits were SKIPPED as not comparable (pyfa would have ' +
                'computed a DIFFERENT fit). This is oracle staleness, not necessarily ' +
                'an engine regression — bump `PYFA_REF` below, then re-run ' +
                '`npm run diff:setup && npm run diff:recalibrate`.'
              : 'The per-ship differential harness found differences NOT in ' +
                '`test/diff/known-diffs.mjs`. Either an engine regression, or a ' +
                'pyfa/SDE drift since the pinned ref.'
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body:
                lede + '\n\n' +
                'Reproduce locally: `npm run diff:setup && npm run diff` ' +
                '(use `--strict` to re-audit the accepted set).\n\n' +
                '```\n' + body.slice(0, 5000) + '\n```',
              labels: ['diff-parity'],
            })
            core.setFailed('Unexpected differential-parity diffs (issue opened).')
