name: pyfa-drift

# Watches pyfa-org/Pyfa's eos/effects.py for changes to the set of hardcoded
# effect handlers. SDE balance changes flow through the data bundle without
# touching this package; NEW hardcoded mechanics are code and need a human to
# port + re-run parity. This job surfaces exactly which effect IDs changed.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Check Pyfa drift
        id: drift
        run: |
          # Do NOT pipe into `tee`: after a pipeline `$?` is tee's status (always
          # 0), so exit-2 drift was swallowed and neither the issue nor the run
          # failure ever fired (49 added upstream effects went unreported from
          # the 2026-06 snapshot to 2026-08). Redirect, capture, then print.
          set +e
          node scripts/check-pyfa-drift.mjs > drift-report.txt 2>&1
          code=$?
          set -e
          cat drift-report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Open issue on drift
        if: steps.drift.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('drift-report.txt', 'utf8')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pyfa effects.py drift detected (${new Date().toISOString().slice(0,10)})`,
              body: '```\n' + body.slice(0, 60000) + '\n```\n\n' +
                    'For each added/changed effect, decide data-driven (no action) vs needs an ' +
                    '`applyLegacy*` handler. `npm run build:data && npm run audit:coverage` here answers ' +
                    'it against the current SDE: anything that leaves `truly silent (real gaps)` at 0 is ' +
                    'already covered by the generic dispatcher. Then `npm run test:pyfa` before releasing, ' +
                    'and advance the baseline with `npm run drift:update`.',
              labels: ['pyfa-drift'],
            })
      - name: Fail the run if drift
        if: steps.drift.outputs.code == '2'
        run: exit 1
